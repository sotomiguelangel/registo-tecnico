<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">


  <title>Indicadores & KPIs · Registo Técnico Moon and Sun</title>

  <style>
    :root {
      --petrol-950:#071922;
      --petrol-900:#0e3341;
      --petrol-800:#134354;
      --petrol-700:#1b5568;
      --petrol-600:#256e82;
      --petrol-100:#e5f0f3;
      --petrol-50:#f2f7f9;

      --aqua-600:#0dab9e;
      --aqua-500:#14b8a6;
      --aqua-400:#2dd4bf;
      --aqua-300:#5eead4;
      --aqua-100:#ccfbf1;
      --aqua-50:#f0fdfa;

      --amber-600:#b45309;
      --amber-500:#d97706;
      --amber-100:#fef3c7;
      --coral-600:#dc2626;
      --coral-500:#ef4444;
      --coral-100:#fee2e2;
      --ok-600:#15803d;
      --ok-500:#22c55e;
      --ok-100:#dcfce7;
      --ice-600:#0284c7;
      --ice-500:#0ea5e9;
      --ice-100:#e0f2fe;

      --bg-page:#f8fafc;
      --bg-surface:#fff;
      --bg-surface-elevated:#fff;
      --bg-subtle:#f1f5f9;
      --border-subtle:#e2e8f0;
      --border-strong:#cbd5e1;
      --text-main:#0f172a;
      --text-muted:#475569;
      --text-dim:#94a3b8;
      --text-on-dark:#fff;

      --font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      --radius-sm:6px;
      --radius-md:10px;
      --radius-lg:14px;
      --radius-xl:18px;
      --shadow-sm:0 1px 2px rgba(0,0,0,.04);
      --shadow-md:0 4px 12px rgba(14,51,65,.06);
      --shadow-lg:0 10px 25px rgba(14,51,65,.09);
    }

    [data-theme="dark"] {
      --bg-page:#08151c;
      --bg-surface:#0e222d;
      --bg-surface-elevated:#132d3b;
      --bg-subtle:#173848;
      --border-subtle:#1e4558;
      --border-strong:#2a5b73;
      --text-main:#f1f5f9;
      --text-muted:#94a3b8;
      --text-dim:#64748b;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:var(--font-sans);
      background:var(--bg-page);
      color:var(--text-main);
      line-height:1.5;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    button,select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,a:focus-visible,select:focus-visible {
      outline:3px solid var(--aqua-400);
      outline-offset:3px;
    }

    /* No mostrar posibles datos de ejemplo sin una copia local. */
    body[data-local-ready="false"] #kpiMain {
      display:none !important;
    }

    .kpi-header {
      background:linear-gradient(135deg,var(--petrol-950),var(--petrol-900));
      color:#fff;
      padding:16px 24px;
      box-shadow:var(--shadow-md);
    }

    .header-content,.subbar-inner,.footer-inner {
      max-width:1540px;
      margin:auto;
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }

    .brand-group,.live-status-group,.header-actions {
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .brand-icon {
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      border:1px solid var(--aqua-500);
      border-radius:10px;
      color:var(--aqua-400);
      font-size:22px;
    }

    .brand-titles h1 {
      font-size:1.15rem;
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    .brand-sub { font-size:.8rem; color:#ffffffb8; }

    .brand-badge {
      display:inline-block;
      font-size:.68rem;
      font-weight:700;
      text-transform:uppercase;
      padding:3px 8px;
      border-radius:999px;
      background:var(--petrol-800);
      color:var(--aqua-300);
    }

    .live-beacon {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:.76rem;
    }

    .pulse-dot {
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--amber-500);
    }

    .clock-box { text-align:right; font-family:var(--font-mono); }
    .clock-time { font-size:1.1rem; font-weight:700; }
    .clock-date { font-size:.72rem; color:#ffffffb8; }

    .btn-hdr {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:8px 11px;
      border:1px solid #ffffff40;
      border-radius:10px;
      background:#ffffff12;
      color:#fff;
      font-size:.78rem;
      text-decoration:none;
    }

    .btn-hdr:hover { background:#ffffff25; }
    .primary-action { background:var(--aqua-500); color:var(--petrol-950); }

    .control-subbar {
      padding:12px 24px;
      background:var(--bg-surface);
      border-bottom:1px solid var(--border-subtle);
    }

    .period-filter-group,.chart-controls-strip {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:4px;
      padding:4px;
      background:var(--bg-subtle);
      border-radius:10px;
    }

    .btn-period,.btn-chart-toggle {
      padding:6px 10px;
      border:0;
      border-radius:6px;
      background:transparent;
      color:var(--text-muted);
      font-size:.78rem;
      font-weight:600;
    }

    .btn-period.active,.btn-chart-toggle.active {
      background:var(--bg-surface);
      color:var(--text-main);
      box-shadow:var(--shadow-sm);
    }

    .refresh-status-group {
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      color:var(--text-muted);
      font-size:.78rem;
    }

    .auto-refresh-pill {
      padding:6px 10px;
      background:var(--bg-subtle);
      border-radius:6px;
    }

    select {
      background:var(--bg-surface);
      color:var(--text-main);
      border:1px solid var(--border-subtle);
      border-radius:6px;
      padding:5px;
    }

    .diagnostic-wrap {
      width:100%;
      max-width:1540px;
      margin:18px auto 0;
      padding:0 24px;
    }

    .diagnostic-box {
      padding:16px 18px;
      border:1px solid #eab308;
      border-radius:12px;
      background:#fffbeb;
      color:#713f12;
      font-size:.85rem;
      overflow-wrap:anywhere;
    }

    .diagnostic-box strong { display:block; margin-bottom:6px; }
    .diagnostic-box ul { padding-left:20px; }
    .diagnostic-box p { margin-top:8px; }
    .diagnostic-version { font-family:var(--font-mono); font-size:.75rem; }

    .kpi-main {
      max-width:1540px;
      width:100%;
      margin:0 auto;
      padding:24px;
      display:flex;
      flex-direction:column;
      gap:24px;
      flex:1;
    }

    .compliance-banner,.dashboard-panel,.kpi-card {
      background:var(--bg-surface);
      border:1px solid var(--border-subtle);
      border-radius:14px;
      box-shadow:var(--shadow-sm);
      padding:20px;
    }

    .compliance-banner {
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:16px;
    }

    .compliance-left { display:flex; align-items:center; gap:12px; }

    .compliance-icon {
      width:44px;
      height:44px;
      flex-shrink:0;
      display:grid;
      place-items:center;
      border-radius:10px;
      background:var(--amber-100);
      color:var(--amber-600);
      font-size:22px;
    }

    .compliance-title { font-weight:700; }
    .compliance-sub { font-size:.82rem; color:var(--text-muted); }
    .compliance-stats { display:flex; gap:8px; flex-wrap:wrap; }

    .compliance-chip {
      padding:5px 10px;
      background:var(--bg-subtle);
      border-radius:999px;
      font-size:.75rem;
    }

    .chip-dot,.equip-dot {
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--text-dim);
    }

    .chip-dot.ok,.equip-dot.ok { background:var(--ok-500); }
    .chip-dot.warn { background:var(--amber-500); }
    .chip-dot.danger,.equip-dot.danger { background:var(--coral-500); }

    .kpi-cards-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:18px;
    }

    .kpi-card { display:flex; flex-direction:column; gap:12px; }
    .kpi-card-head { display:flex; justify-content:space-between; gap:8px; }
    .kpi-card-title { font-size:.78rem; font-weight:700; color:var(--text-muted); }
    .kpi-value-row { display:flex; align-items:baseline; gap:8px; }

    .kpi-big-number {
      font:800 1.85rem var(--font-mono);
      overflow-wrap:anywhere;
    }

    .kpi-unit { font-size:.85rem; color:var(--text-muted); }

    .kpi-card-foot {
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:8px;
      padding-top:10px;
      border-top:1px solid var(--border-subtle);
      font-size:.75rem;
      color:var(--text-muted);
      margin-top:auto;
    }

    .small-note { font-size:.78rem; color:var(--text-muted); }
    .kpi-trend.down { color:var(--ok-600); }
    .kpi-trend.up { color:var(--amber-600); }
    .kpi-trend.neutral { color:var(--text-muted); }

    .kpi-status-badge {
      display:inline-block;
      font-size:.68rem;
      font-weight:700;
      padding:3px 7px;
      border-radius:6px;
      background:var(--bg-subtle);
      color:var(--text-muted);
    }

    .kpi-status-badge.ok { background:var(--ok-100); color:var(--ok-600); }
    .kpi-status-badge.warn { background:var(--amber-100); color:var(--amber-600); }
    .kpi-status-badge.danger { background:var(--coral-100); color:var(--coral-600); }

    .bento-charts-grid {
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:20px;
    }

    .dashboard-panel { display:flex; flex-direction:column; gap:16px; min-width:0; }

    .panel-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
      border-bottom:1px solid var(--border-subtle);
      padding-bottom:12px;
    }

    .panel-head h2 { font-size:1rem; }
    .panel-head p { font-size:.78rem; color:var(--text-muted); }

    .chart-container-box {
      position:relative;
      width:100%;
      height:280px;
    }

    .chart-svg-root { width:100%; height:100%; overflow:visible; }

    .chart-tooltip {
      position:absolute;
      pointer-events:none;
      background:rgba(14,51,65,.95);
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      font-size:.76rem;
      z-index:20;
      opacity:0;
      transform:translate(-50%,-100%);
      white-space:nowrap;
    }

    .chart-tooltip.show { opacity:1; }

    .chart-foot {
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:10px;
      padding-top:10px;
      border-top:1px solid var(--border-subtle);
      font-size:.76rem;
      color:var(--text-muted);
    }

    .equipment-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
      gap:14px;
    }

    .equip-card {
      background:var(--bg-subtle);
      border:1px solid var(--border-subtle);
      border-radius:10px;
      padding:14px;
    }

    .equip-top { display:flex; justify-content:space-between; align-items:center; }
    .equip-name { font-size:.8rem; font-weight:700; }
    .equip-temp { font:800 1.45rem var(--font-mono); margin:8px 0; }
    .equip-range,.equip-meta { font-size:.72rem; color:var(--text-muted); }
    .equip-range strong { margin-left:5px; }

    .equip-bar-wrap,.exec-pillar-bar {
      height:6px;
      background:var(--border-subtle);
      border-radius:999px;
      overflow:hidden;
      margin:8px 0;
    }

    .equip-bar-fill,.exec-pillar-fill { height:100%; border-radius:999px; }
    .equip-bar-fill.ok { background:var(--ok-500); }
    .equip-bar-fill.danger { background:var(--coral-500); }

    .room-progress-box { display:flex; align-items:center; gap:20px; }
    .radial-chart-wrap { position:relative; width:100px; height:100px; flex-shrink:0; }
    .radial-chart-svg { width:100%; height:100%; transform:rotate(-90deg); }

    .radial-chart-text {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      font:800 1.15rem var(--font-mono);
    }

    .room-stats-list { display:flex; flex-direction:column; gap:8px; flex:1; }
    .room-stat-row { display:flex; justify-content:space-between; gap:12px; font-size:.8rem; color:var(--text-muted); }
    .room-stat-row strong { color:var(--text-main); }

    .table-wrapper { overflow-x:auto; border:1px solid var(--border-subtle); border-radius:10px; }
    .kpi-table { width:100%; border-collapse:collapse; font-size:.8rem; text-align:left; }
    .kpi-table th,.kpi-table td { padding:10px 14px; border-bottom:1px solid var(--border-subtle); }
    .kpi-table th { background:var(--bg-subtle); color:var(--text-muted); white-space:nowrap; }
    .kpi-table tr:last-child td { border-bottom:0; }

    .tag-type { font-size:.7rem; padding:3px 6px; border-radius:6px; display:inline-block; }
    .tag-type.general { background:var(--ice-100); color:var(--ice-600); }
    .tag-type.quarto { background:var(--petrol-100); color:var(--petrol-700); }
    .tag-type.temperatura { background:var(--aqua-100); color:var(--aqua-600); }

    /* Estilos utilizados pelo controlador executivo existente. */
    .exec-score-card,.exec-fin-card,.exec-matrix-card {
      background:var(--bg-surface);
      border:1px solid var(--border-subtle);
      border-radius:18px;
      padding:20px 24px;
      margin-bottom:18px;
    }

    .exec-score-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .exec-score-title,.exec-matrix-title { font-size:1rem; font-weight:700; color:var(--text-main); }
    .exec-matrix-title { margin-bottom:14px; }

    .exec-score-badge {
      font:700 .72rem var(--font-mono);
      border-radius:20px;
      padding:5px 12px;
      background:var(--bg-subtle);
    }

    .status-exc { border-color:var(--ok-500); }
    .exec-score-badge.status-exc { background:var(--ok-100); color:#166534; }
    .exec-score-badge.status-good { background:var(--aqua-100); color:var(--petrol-800); }
    .exec-score-badge.status-warn { background:var(--amber-100); color:#92400e; }
    .exec-score-badge.status-bad { background:var(--coral-100); color:#991b1b; }

    .exec-score-hero { display:flex; align-items:center; gap:20px; margin-bottom:18px; flex-wrap:wrap; }

    .exec-score-circle {
      width:82px;
      height:82px;
      border:5px solid var(--ok-500);
      border-radius:50%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .exec-score-circle.status-good { border-color:var(--aqua-500); }
    .exec-score-circle.status-warn { border-color:var(--amber-500); }
    .exec-score-circle.status-bad { border-color:var(--coral-500); }
    .exec-score-circle.status-zero { border-color:var(--border-strong); }
    .exec-score-number { font:800 1.45rem var(--font-mono); }
    .exec-score-unit { font-size:.65rem; }
    .exec-score-text { flex:1; min-width:200px; }
    .exec-score-headline { font-weight:700; margin-bottom:4px; }
    .exec-score-desc { font-size:.85rem; color:var(--text-muted); }

    .exec-pillars-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:10px; }
    .exec-pillar-item { background:var(--bg-page); border:1px solid var(--border-subtle); border-radius:10px; padding:12px; }
    .exec-pillar-head { display:flex; justify-content:space-between; gap:8px; font-size:.8rem; font-weight:700; }
    .exec-pillar-val { font-family:var(--font-mono); }
    .exec-pillar-note { font-size:.7rem; color:var(--text-muted); }

    .exec-fin-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .exec-fin-box { padding:16px; border:1px solid var(--border-subtle); border-radius:14px; background:var(--bg-page); }
    .exec-fin-box.accent { border-color:var(--aqua-500); }
    .exec-fin-lab { font-size:.72rem; color:var(--text-muted); text-transform:uppercase; }
    .exec-fin-val { font:800 1.6rem var(--font-mono); margin:6px 0; }
    .exec-fin-sub { font-size:.75rem; color:var(--text-muted); }
    .exec-split-bar-wrap { margin-top:16px; }
    .exec-split-labels,.exec-split-legend { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:.75rem; margin:6px 0; }
    .exec-split-track { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--border-subtle); }
    .exec-split-seg-a { background:var(--aqua-500); }
    .exec-split-seg-b { background:var(--ice-600); }

    .exec-action-item { border-left:4px solid; border-radius:10px; padding:12px 16px; margin-top:10px; }
    .exec-action-item.crit { background:var(--coral-100); border-color:var(--coral-500); color:#7f1d1d; }
    .exec-action-item.warn { background:var(--amber-100); border-color:var(--amber-500); color:#78350f; }
    .exec-action-item.info { background:var(--ice-100); border-color:var(--ice-600); color:#0c4a6e; }
    .exec-action-item.ok { background:var(--ok-100); border-color:var(--ok-500); color:#14532d; }
    .exec-action-head { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:.88rem; font-weight:700; }
    .exec-action-tag { font-size:.68rem; padding:2px 6px; background:#ffffff80; border-radius:4px; }
    .exec-action-body,.exec-action-rec { font-size:.8rem; margin-top:5px; }

    .heatmap-card { padding:16px; background:var(--bg-page); border:1px solid var(--border-subtle); border-radius:14px; }
    .heatmap-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
    .heatmap-head .ttl { font-size:.82rem; font-weight:700; }
    .heatmap-nav { display:flex; gap:6px; }
    .heatmap-nav button { padding:4px 12px; border:1px solid var(--border-subtle); background:var(--bg-surface); color:var(--text-main); border-radius:6px; }
    .heatmap-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .heatmap-dow { text-align:center; font-size:.7rem; color:var(--text-muted); }
    .heatmap-cell { aspect-ratio:1; max-height:65px; display:flex; justify-content:center; align-items:center; border-radius:6px; font-size:.78rem; }
    .hc-empty { background:transparent; }
    .hc-none { background:var(--bg-subtle); color:var(--text-muted); }
    .hc-ok { background:var(--ok-500); color:#fff; }
    .hc-bad { background:var(--coral-500); color:#fff; }
    .hc-future { border:1px dashed var(--border-strong); color:var(--text-dim); }
    .heatmap-legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; font-size:.72rem; color:var(--text-muted); }
    .heatmap-legend span { display:flex; align-items:center; gap:6px; }
    .heatmap-legend i { display:inline-block; width:12px; height:12px; border-radius:3px; }

    .kpi-footer {
      padding:18px 24px;
      background:var(--bg-surface);
      border-top:1px solid var(--border-subtle);
      font-size:.75rem;
      color:var(--text-muted);
      margin-top:auto;
    }

    @media(max-width:1024px) {
      .bento-charts-grid { grid-template-columns:1fr; }
    }

    @media(max-width:640px) {
      .kpi-main { padding:14px; }
      .diagnostic-wrap { padding:0 14px; }
      .kpi-header,.control-subbar { padding:14px; }
      .exec-fin-grid { grid-template-columns:1fr; }
      .room-progress-box { flex-wrap:wrap; }
      .header-actions { gap:6px; }
    }

    @media print {
      .header-actions,.control-subbar { display:none !important; }
      body { background:#fff; color:#000; }
      .kpi-main { padding:0; }
      .kpi-card,.dashboard-panel,.exec-score-card,.exec-fin-card,.exec-matrix-card {
        box-shadow:none;
        break-inside:avoid;
      }
      /* Mantener el aviso de validación también en las impresiones. */
      .diagnostic-wrap { margin-bottom:16px; }
    }
  </style>

  <script>
    /*
     * Diagnóstico independiente del controlador.
     * No modifica registros, tokens, tarifas ni la base de datos.
     */
    window.KPI_DIAG = {
      controller: 'A aguardar carregamento',
      d3: 'A aguardar carregamento',
      errors: []
    };

    window.kpiResourceStatus = function(resource, success) {
      if (resource === 'controller') {
        window.KPI_DIAG.controller = success
          ? 'Arquivo recebido — isto não confirma a execução completa'
          : 'ERRO: não foi possível carregar ./indicadores.js';
      }

      if (resource === 'd3') {
        window.KPI_DIAG.d3 = success && window.d3
          ? 'Biblioteca disponível'
          : 'ERRO: não foi possível disponibilizar a biblioteca D3';
      }

      if (typeof window.renderKpiDiagnostics === 'function') {
        window.renderKpiDiagnostics();
      }
    };

    // Compatibilidade com o controlador existente.
    window.esc = function(value) {
      var entities = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      };

      return String(value == null ? '' : value).replace(
        /[&<>"']/g,
        function(character) { return entities[character]; }
      );
    };

    window.safeFetch = async function(url, opts, timeoutMs) {
      opts = opts || {};
      timeoutMs = timeoutMs || 12000;

      if (opts.signal) {
        return window.fetch(url, opts);
      }

      var controller = new AbortController();
      var timer = setTimeout(function() {
        controller.abort();
      }, timeoutMs);

      try {
        return await window.fetch(
          url,
          Object.assign({}, opts, { signal: controller.signal })
        );
      } finally {
        clearTimeout(timer);
      }
    };

    function recordKpiError(message) {
      var text = String(message || 'Erro JavaScript sem detalhe');

      if (window.KPI_DIAG.errors.indexOf(text) === -1) {
        window.KPI_DIAG.errors.push(text);
      }

      if (typeof window.renderKpiDiagnostics === 'function') {
        window.renderKpiDiagnostics();
      }
    }

    // Registrar errores sin ocultarlos ni cancelar su propagación.
    window.addEventListener('error', function(event) {
      if (event.message) {
        recordKpiError(event.message);
      }
    });

    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      recordKpiError(reason && reason.message ? reason.message : reason);
    });
  </script>

  <script>
    /*
     * Diagnóstico visual del almacenamiento.
     * Es independiente de indicadores.js y no escribe en localStorage.
     */
    (function() {
      function put(id, text) {
        var element = document.getElementById(id);
        if (element) element.textContent = text;
      }

      function getCollectionItems(parsed, type) {
        var entry = parsed[type];

        if (entry == null) return [];

        var items = Array.isArray(entry) ? entry : entry.items;

        if (!Array.isArray(items)) {
          throw new Error('Formato inesperado na coleção "' + type + '".');
        }

        return items;
      }

      window.renderKpiDiagnostics = function() {
        var diag = window.KPI_DIAG;

        put('diagController', diag.controller);
        put('diagD3', window.d3 ? 'Biblioteca disponível' : diag.d3);

        put(
          'diagErrors',
          diag.errors.length
            ? diag.errors.slice(-3).join(' | ')
            : 'Nenhum erro não tratado detetado até agora'
        );

        try {
          var raw = localStorage.getItem('bitacora_store');

          if (!raw) {
            document.body.dataset.localReady = 'false';

            put('diagStorage', 'Não existe bitacora_store neste navegador/origem.');
            put(
              'diagInstructions',
              'Abra a App Principal, inicie sessão e consulte os registos. ' +
              'Depois volte aqui no mesmo navegador e perfil. ' +
              'Não utilize uma janela privada para consultar a cópia da sessão normal.'
            );
            return;
          }

          var parsed = JSON.parse(raw);

          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
            throw new Error('O conteúdo de bitacora_store não é um objeto válido.');
          }

          var general = getCollectionItems(parsed, 'general');
          var quarto = getCollectionItems(parsed, 'quarto');
          var temperatura = getCollectionItems(parsed, 'temperatura');

          var total = general.length + quarto.length + temperatura.length;

          document.body.dataset.localReady = total > 0 ? 'true' : 'false';

          put(
            'diagStorage',
            general.length + ' gerais · ' +
            quarto.length + ' de quartos · ' +
            temperatura.length + ' de temperatura'
          );

          put(
            'diagInstructions',
            total > 0
              ? 'A cópia local está acessível. Se os gráficos não aparecerem, ' +
                'verifique as linhas “Controlador”, “Gráficos D3” e “Erros de execução” acima. ' +
                'Se estiverem vazios apenas num período, experimente “Histórico Completo”.'
              : 'O armazenamento existe, mas estas coleções estão vazias. ' +
                'Consulte os módulos na app principal para atualizar a cópia local.'
          );
        } catch (error) {
          document.body.dataset.localReady = 'false';

          put('diagStorage', 'ERRO: ' + error.message);
          put(
            'diagInstructions',
            'Não apague os dados do navegador. Copie este aviso para verificar o problema.'
          );
        }
      };

      document.addEventListener('DOMContentLoaded', function() {
        window.renderKpiDiagnostics();

        // Refrescar después de que los demás manejadores de inicio se ejecuten.
        setTimeout(window.renderKpiDiagnostics, 0);
        setTimeout(window.renderKpiDiagnostics, 2000);

        var refreshButton = document.getElementById('btnManualRefresh');

        if (refreshButton) {
          refreshButton.addEventListener('click', function() {
            setTimeout(window.renderKpiDiagnostics, 0);
          });
        }

        setInterval(window.renderKpiDiagnostics, 30000);
      });

      window.addEventListener('storage', function(event) {
        if (event.key === 'bitacora_store' || event.key === null) {
          window.renderKpiDiagnostics();
        }
      });

window.addEventListener('focus', function() {
        window.renderKpiDiagnostics();
      });
    })();
